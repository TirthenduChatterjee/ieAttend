services:

  frontend:
    build: ./Frontend/ieAttendance
    image: ghcr.io/tirthenduchatterjee/ie-attend-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    image: ghcr.io/tirthenduchatterjee/ie-attend-backend:latest
    build:
      context: .
      dockerfile: HRMS/Dockerfile
    ports:
      - "7207:7207"
